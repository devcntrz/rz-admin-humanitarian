stages:
  - builddocker
  - deploy

deploy_production:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client openssl
    - eval $(ssh-agent -s)
    - echo "${ANTMAN_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - ssh-keyscan -p 2023 ${SERVER_AG} >> ~/.ssh/known_hosts
  script:
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2023 gitlab@${SERVER_ANTMAN} "cd /mnt/volume/docker/docker_app/api/api-rz-humanitarian-v1 && git fetch --tags && git checkout ${CI_COMMIT_TAG}"
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2023 gitlab@${SERVER_ANTMAN} "cd /mnt/volume/docker/docker_app/api/api-rz-humanitarian-v1 && docker compose up -d --build --force-recreate"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
    - when: never
  environment:
    name: production
    url: https://api-rz-humanitarian-v1.rumahzakat.org

deploy_staging:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client openssl
    - eval $(ssh-agent -s)
    - echo "${AG_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - ssh-keyscan -p 2244 ${SERVER_AG} >> ~/.ssh/known_hosts
  script:
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2244 gitlab@${SERVER_AG} "cd /docker/be-dev/api-rz-humanitarian-v1 && git pull origin development"
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2244 gitlab@${SERVER_AG} "cd /docker/be-dev/api-rz-humanitarian-v1 && docker compose up -d --build --force-recreate"
  rules:
    - if: $CI_COMMIT_REF_NAME == "development"
      when: always
    - when: never
  environment:
    name: staging
    url: https://api-rz-humanitarian-v1.cinte.id
